<!doctype html>
<html><head><meta charset="utf-8">
<style>
:root{--bg:#060810;--panel:#0a0c14;--border:rgba(80,120,180,.18);--text:#c0c8d8;--mid:#8894aa;--dim:#505a70;--amber:#e8a020;--cyan:#38b8d0;--green:#38c868;--red:#d04040}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,Inter,system-ui,sans-serif;width:1400px}
.mono{font-family:"SF Mono",Menlo,monospace}
.top{height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid var(--border);background:var(--panel)}
.top *{white-space:nowrap}
.brand{color:var(--cyan);font-size:12px;letter-spacing:.12em;margin-right:4px}
.lab{font-size:9px;letter-spacing:.14em;color:var(--dim)}
.f{border:1px solid var(--border);padding:4px 9px;font-size:12px;color:var(--cyan)}
.b{border:1px solid var(--border);padding:4px 9px;font-size:11px;color:var(--mid);background:#0e121e}
.b.on{border-color:var(--cyan);color:var(--cyan);background:rgba(56,184,208,.12)}
.div{width:1px;height:22px;background:var(--border)}
.wrap{padding:14px;display:grid;gap:14px}
.panel{border:1px solid var(--border);background:var(--panel)}
.ph{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-bottom:1px solid var(--border);gap:10px}
.ph h3{font-size:10px;letter-spacing:.18em;color:var(--mid);font-weight:500}
.pb{padding:12px}
.seg{display:flex}.seg .b+.b{border-left:none}
.hint{font-size:11px;color:var(--dim)}
.grid{display:grid;grid-template-columns:150px repeat(12,1fr);gap:3px;align-items:center}
.cell{height:24px;border-radius:2px}
.mon{font-size:10px;color:var(--dim);text-align:center}
.site{font-size:11px;color:var(--mid);white-space:nowrap}
.rank{display:grid;grid-template-columns:26px 170px 1fr 70px 70px 80px 80px 40px;gap:8px;align-items:center;font-size:12px;padding:4px 0;border-bottom:1px solid rgba(80,120,180,.08)}
.rank.h{font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase}
.rank .n{color:var(--dim);font-family:"SF Mono",Menlo,monospace}
.track{height:12px;background:rgba(30,30,45,.9);position:relative}
.num{font-family:"SF Mono",Menlo,monospace;text-align:right}
.pin{color:var(--dim);text-align:center;font-size:13px}
.stack .row{display:grid;grid-template-columns:200px 1fr 64px 64px 64px 64px 24px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(80,120,180,.08)}
.stack .row.h{font-size:9px;letter-spacing:.1em;color:var(--dim);text-transform:uppercase;padding:2px 0}
.bars{display:flex;gap:1px}.bars div{flex:1;height:9px}
.nm{font-size:13px}.sub{font-size:10px;color:var(--dim)}
</style></head><body>
<div class="top">
  <span class="brand">☾ LUNAR NAV</span><div class="div"></div>
  <span id="inputs" style="display:flex;align-items:center;gap:8px"></span>
  <span class="b on">▶ Compute</span>
  <div class="div"></div>
  <span class="lab">HORIZON</span><span class="b">Smooth</span><span class="b on">Terrain</span><span class="b mono">2 m eye</span>
</div>
<div class="wrap">
  <div class="panel">
    <div class="ph">
      <div style="display:flex;align-items:center;gap:12px">
        <h3>PLAN</h3>
        <div class="seg" id="modes"><span class="b" data-v="date">Pick a date → where?</span><span class="b" data-v="site">Pick a site → when?</span><span class="b" data-v="explore">Explore</span></div>
        <span class="hint" id="hint"></span>
      </div>
      <div class="seg" id="metrics"><span class="b on">Sunlit %</span><span class="b">Longest dark</span><span class="b">Earth in view</span><span class="b">Longest blackout</span></div>
    </div>
    <div class="pb" id="body"></div>
  </div>
  <div class="panel">
    <div class="ph"><h3>COMPARE · 3 PINNED</h3><span class="b on">📌 Pin current</span></div>
    <div class="pb stack" id="stack"></div>
  </div>
</div>
<script>
const view=(location.search.match(/view=(\w+)/)||[,"date"])[1];
document.querySelectorAll("#modes .b").forEach(b=>b.classList.toggle("on",b.dataset.v===view));
const hint={date:"Ranks every site for Aug 14–28, 2027 (your FROM–TO)",site:"Every possible 14-day stay at Mons Mouton Plateau in 2027",explore:""}[view];
const DATES=`<span class="lab">FROM</span><span class="f mono">2027-08-14</span><span class="lab">TO</span><span class="f mono">2027-08-28</span>`;
const SITE=`<span class="lab">SITE</span><span class="f">Mons Mouton Plateau</span>`;
const STAY=`<span class="lab">STAY</span><span class="f mono">14</span><span class="lab">DAYS</span><span class="lab" style="margin-left:6px">IN</span><span class="f mono">2027</span>`;
document.getElementById("inputs").innerHTML={date:DATES,site:SITE+'<div class="div"></div>'+STAY,explore:STAY}[view];
document.getElementById("hint").textContent=hint;
let s=11;const r=()=>{s=(s*9301+49297)%233280;return s/233280};
const ramp=["#1a1206","#3d2808","#6a430c","#9c6410","#cf8618","#f0a830","#ffd27a"];
const col=v=>ramp[Math.min(6,Math.floor(v*7))];
const sites=["Haworth","Malapert Massif","Mons Mouton","Mons Mouton Plateau","Nobile Rim 1","Nobile Rim 2","Peak Near Cabeus B","Slater Plain","de Gerlache Rim 2","Blue Moon MK1"];
const body=document.getElementById("body");
if(view==="date"){
  const rows=sites.map((n,i)=>{const v=[.41,.79,.74,.88,.83,.52,.61,.47,.69,.91][i];return{n,v,dark:(1-v)*9+.4,earth:Math.round(45+r()*35),bo:(2+r()*5).toFixed(1)}}).sort((a,b)=>b.v-a.v);
  let h=`<div class="rank h"><span>#</span><span>Site</span><span>Sunlit, Aug 14–28</span><span class="num">Sunlit</span><span class="num">Longest dark</span><span class="num">Earth in view</span><span class="num">Blackout</span><span></span></div>`;
  rows.forEach((x,i)=>{h+=`<div class="rank"><span class="n">${i+1}</span><span style="${x.n==="Mons Mouton Plateau"?"color:var(--cyan)":""}">${x.n}</span>
  <span class="track"><span style="position:absolute;left:0;top:0;bottom:0;width:${x.v*100}%;background:${col(x.v)}"></span></span>
  <span class="num" style="color:var(--amber)">${Math.round(x.v*100)}%</span><span class="num">${x.dark.toFixed(1)} d</span><span class="num" style="color:var(--cyan)">${x.earth}%</span><span class="num">${x.bo} d</span><span class="pin">📌</span></div>`});
  body.innerHTML=h+`<div class="hint" style="margin-top:8px">Click a site to load it · 📌 to pin it below</div>`;
}
if(view==="site"){
  const days=365,W=1340,H=120;let bars="";const vals=[];
  for(let d=0;d<days;d++){const v=Math.max(.05,Math.min(.99,.62+.25*Math.cos((d-200)/365*2*Math.PI)+.14*Math.sin(d/29.5*2*Math.PI*1.0+1)+(r()-.5)*.08));vals.push(v)}
  const order=vals.map((v,d)=>[v,d]).sort((a,b)=>b[0]-a[0]);const picks=[];
  for(const [v,d] of order){if(picks.every(p=>Math.abs(p[1]-d)>40))picks.push([v,d]);if(picks.length===3)break}
  const best=picks.map(([v,d])=>[Math.max(0,d-3),Math.min(364,d+4),v]);
  const fmt=d=>{const t=new Date(Date.UTC(2027,0,1+d));return t.toLocaleString("en-US",{month:"short",day:"numeric",timeZone:"UTC"})};
  const worst=order[order.length-1];
  best.forEach(([a,b])=>bars+=`<rect x="${a/days*W}" y="0" width="${(b-a)/days*W}" height="${H}" fill="rgba(56,200,104,.12)"/>`);
  vals.forEach((v,d)=>bars+=`<rect x="${d/days*W}" y="${H-v*H}" width="${W/days+.4}" height="${v*H}" fill="${col(v)}"/>`);
  const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let ax=MN.map((m,i)=>`<text x="${i/12*W+4}" y="${H+14}" fill="#505a70" font-size="10">${m}</text>`).join("");
  best.forEach(([a,b],i)=>{const cx=(a+b)/2/days*W;
    ax+=`<circle cx="${cx}" cy="-30" r="9" fill="none" stroke="#38c868" stroke-width="1.3"/>`+
        `<text x="${cx}" y="-26" fill="#38c868" font-size="11" text-anchor="middle" font-weight="600">${i+1}</text>`+
        `<text x="${cx}" y="-8" fill="#38c868" font-size="10" text-anchor="middle">${fmt(a)}–${fmt(b)}</text>`});
  body.innerHTML=`<svg width="${W}" height="${H+60}" viewBox="0 -44 ${W} ${H+60}" style="overflow:visible;margin-top:4px">${bars}${ax}</svg>
   <div class="hint" style="margin-top:6px">Each bar is one landing day: sunlight over the 14 days that follow. Click a day to load that stay, or 📌 a best window to compare it.</div>`;
}
if(view==="explore"){
  const MN=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  let h=`<div class="grid"><div></div>`+MN.map(m=>`<div class="mon">${m}</div>`).join("");
  sites.forEach((n,si)=>{h+=`<div class="site">${n}</div>`;const base=[.6,.8,.72,.76,.8,.55,.62,.58,.72,.83][si];
    for(let i=0;i<12;i++){const v=Math.max(0,Math.min(.999,base+.22*Math.cos((i-6)/12*2*Math.PI+si*.5)+(r()-.5)*.18));h+=`<div class="cell" style="background:${col(v)};"></div>`}});
  h+=`</div><div style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:11px;color:var(--dim)"><span>0%</span>${ramp.map(c=>`<span style="width:22px;height:10px;background:${c}"></span>`).join("")}<span>100% sunlit</span><span style="margin-left:auto">Click a cell to load that site and month</span></div>`;
  body.innerHTML=h;
}
const sc=[
 {n:"Mons Mouton Plateau",d:"Aug 14 – 28, 2027",sun:"88%",dark:"1.6 d",earth:"52%",bo:"5.2 d",bar:"11111011111111",e:"11101111011110",c:"var(--green)"},
 {n:"Malapert Massif",d:"Aug 14 – 28, 2027",sun:"79%",dark:"2.9 d",earth:"71%",bo:"3.0 d",bar:"11100011111110",e:"01111011110111",c:""},
 {n:"Mons Mouton Plateau",d:"Mar 4 – 18, 2027",sun:"97%",dark:"0.4 d",earth:"44%",bo:"6.8 d",bar:"11111111111111",e:"00011110000111",c:"var(--green)"}];
let st=`<div class="row h"><span>Scenario</span><span>Day by day · ☀ sun / 📡 Earth</span><span class="num">Sunlit</span><span class="num">Dark</span><span class="num">Earth</span><span class="num">Blackout</span><span></span></div>`;
sc.forEach(x=>{
 const strip=(s,c)=>`<div class="bars">${[...s].map(b=>`<div style="background:${b==="1"?c:"rgba(30,30,45,.9)"}"></div>`).join("")}</div>`;
 st+=`<div class="row"><div><div class="nm">${x.n}</div>${(view!=="date"||x.d!=="Aug 14 – 28, 2027")?`<div class="sub" style="color:var(--amber)">${x.d}</div>`:""}</div>
 <div style="display:grid;gap:3px">${strip(x.bar,"#e8a020")}${strip(x.e,"#38b8d0")}</div>
 <span class="num" style="color:${x.c||"var(--amber)"}">${x.sun}</span><span class="num">${x.dark}</span><span class="num" style="color:var(--cyan)">${x.earth}</span><span class="num">${x.bo}</span><span class="pin">✕</span></div>`});
document.getElementById("stack").innerHTML=st;
</script>
</body></html>
