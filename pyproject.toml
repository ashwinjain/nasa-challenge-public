[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lunar-navigator"
version = "0.1.0"
description = "Lunar Landing Site Navigator — Sun/Earth visibility from any point on the Moon"
requires-python = ">=3.10"
dependencies = [
    "skyfield>=1.49",
    "numpy>=1.24",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "httpx>=0.25",
]
# Reading the big GeoTIFF maps, from data/ or the Firebase Storage bucket
# (lunarsky/data.py). rasterio's wheels bundle GDAL; google-auth gets the
# bucket login (needs requests for its HTTP transport). pyproj converts site
# lat/lon to the maps' polar stereographic x/y (Phase 2 skylines).
maps = [
    "rasterio>=1.3",
    "pyproj>=3.6",
    "google-auth>=2.20",
    "requests>=2.31",
]

[tool.setuptools.packages.find]
include = ["lunarsky*"]
